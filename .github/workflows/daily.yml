name: 每日数据更新

on:
  push:
    branches: [main]
  schedule:
    # 每天 08:00 北京时间（00:00 UTC）
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4
      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 采集并导出数据
        run: |
          python collector/run.py
          python collector/export.py
      - name: 提交新数据
        run: |
          git config user.name "ecom-bot"
          git config user.email "actions@github.com"
          git add web/data
          if git diff --cached --quiet; then
            echo "数据无变化，跳过提交"
          else
            git commit -m "每日数据更新 $(date -u +%Y-%m-%d)"
            git push
          fi

  deploy:
    needs: collect
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4
      - name: 配置 Pages
        uses: actions/configure-pages@v5
      - name: 上传网站
        uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - name: 发布
        uses: actions/deploy-pages@v4
